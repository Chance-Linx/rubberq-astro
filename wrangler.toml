# RubberQ Astro — Cloudflare Pages
name = "rubberq-astro"
pages_build_output_dir = "./dist"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]

# Required by @astrojs/cloudflare for session management
[[kv_namespaces]]
binding = "SESSION"
id = "a3aa3fb1f6ac4eb68986c5fd18f1f8f6"

# Account-level R2 bucket used for RubberQ public assets.
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "rubberq-images"
