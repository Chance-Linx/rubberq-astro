# RubberQ Astro — Cloudflare Pages
name = "rubberq-astro"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]

# Required by @astrojs/cloudflare for session management
[[kv_namespaces]]
binding = "SESSION"
id = "rubberq-sessions"

# Account-level R2 bucket used for RubberQ public assets.
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "rubberq-images"
